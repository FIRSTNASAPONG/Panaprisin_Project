name: Panaprisin_Project_Prod

services:
  db:
    image: postgres:16-alpine
    container_name: panaprisin_postgres
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    image: ghcr.io/firstnasapong/panaprisin_project-web:latest
    container_name: panaprisin_web
    restart: unless-stopped
    ports:
      - "6018:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      - db

volumes:
  postgres_data: