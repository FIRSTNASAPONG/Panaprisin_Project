name: Panaprisin_Project_Prod

services:
  db:
    image: postgres:18-alpine
    container_name: panaprisin_postgres
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    image: ghcr.io/firstnasapong/panaprisin_project-web:latest
    container_name: panaprisin_web
    restart: unless-stopped
    ports:
      - "6018:3000"
    depends_on:
      - db

volumes:
  postgres_data: